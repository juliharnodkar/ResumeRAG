spring.application.name=resume-rag

# Chat: local Ollama. Extraction fails closed (empty list) if the LLM is unavailable.
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.num-predict=800

spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.ai.chat.client.advisor=INFO
logging.level.com.example.resumerag=INFO

spring.ai.embedding.transformer.onnx.model-uri=classpath:/onnx/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.google.genai.api-key=${AIzaSyBFC9OST3bT_7FbNCYKmgDhdKRekl-Tg-o}
